<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allebasi - Datos de envío</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="con-referencia">
    <div class="form-col">
      <h1>Además, te pido que por favor me confirmes tus datos completos para el envío:</h1>

      <form id="formPersonal">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" required>

        <label for="documento">Número de documento:</label>
        <input type="text" id="documento" required>

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" required>

        <label for="telefono">Número de teléfono de contacto:</label>
        <div class="fila-telefono">
          <select id="indicativo" aria-label="Indicativo de país"></select>
          <input type="tel" id="telefono" placeholder="3001234567" required>
        </div>

        <label for="direccion">Dirección de envío completa:</label>
        <input type="text" id="direccion" required>

        <div class="fila-botones" style="margin-top:26px">
          <button type="button" class="btn btn-secundario" onclick="cancelar()">CANCELAR</button>
          <button type="submit" class="btn" id="btnAceptar">ACEPTAR</button>
        </div>
      </form>
    </div>

    <div class="referencia" id="referencia"></div>
  </div>

  <img class="logo" style="margin-top:40px" src="assets/logo_allebasi.jpg" alt="Allebasi">

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    // Indicativos telefónicos. Colombia va primero y queda seleccionado
    // por defecto; el valor de cada opción es solo el número del
    // indicativo (sin "+"), que se pega directo al teléfono que escriba
    // el cliente, igual al formato que ya usa el resto del sistema
    // (ej. 573001234567).
    const INDICATIVOS = [
      { pais: "Colombia", cod: "57" },
      { pais: "México", cod: "52" },
      { pais: "Argentina", cod: "54" },
      { pais: "Chile", cod: "56" },
      { pais: "Perú", cod: "51" },
      { pais: "Ecuador", cod: "593" },
      { pais: "Venezuela", cod: "58" },
      { pais: "Bolivia", cod: "591" },
      { pais: "Paraguay", cod: "595" },
      { pais: "Uruguay", cod: "598" },
      { pais: "Panamá", cod: "507" },
      { pais: "Costa Rica", cod: "506" },
      { pais: "Guatemala", cod: "502" },
      { pais: "Honduras", cod: "504" },
      { pais: "El Salvador", cod: "503" },
      { pais: "Nicaragua", cod: "505" },
      { pais: "Rep. Dominicana", cod: "1" },
      { pais: "Puerto Rico", cod: "1" },
      { pais: "Cuba", cod: "53" },
      { pais: "Estados Unidos", cod: "1" },
      { pais: "Canadá", cod: "1" },
      { pais: "España", cod: "34" },
      { pais: "Brasil", cod: "55" },
      { pais: "Reino Unido", cod: "44" },
      { pais: "Francia", cod: "33" },
      { pais: "Italia", cod: "39" },
      { pais: "Alemania", cod: "49" },
      { pais: "Portugal", cod: "351" },
      { pais: "Otro", cod: "" }
    ];

    function cargarIndicativos() {
      const sel = document.getElementById("indicativo");
      INDICATIVOS.forEach(item => {
        const opt = document.createElement("option");
        opt.value = item.cod;
        opt.textContent = item.pais + " (+" + (item.cod || "...") + ")";
        sel.appendChild(opt);
      });
      sel.value = "57"; // Colombia por defecto
    }
    cargarIndicativos();

    const pedido = getPedido();
    if (!pedido.codigoPrenda) {
      irA("index.html");
    }
    pintarReferencia("referencia");

    function cancelar() {
      limpiarPedido();
      irA("index.html");
    }

    document.getElementById("formPersonal").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btnAceptar");
      btn.disabled = true;
      btn.textContent = "Enviando...";

      const datosFinales = setPedido({
        nombreCompleto: document.getElementById("nombre").value.trim(),
        numeroDocumento: document.getElementById("documento").value.trim(),
        correo: document.getElementById("correo").value.trim(),
        telefono: document.getElementById("indicativo").value + document.getElementById("telefono").value.trim().replace(/\D/g, ""),
        direccionEnvio: document.getElementById("direccion").value.trim()
      });

      try {
        const resultado = await apiPost(datosFinales);
        setPedido({ valorTotal: resultado.valorTotal, valorUnitario: resultado.valorUnitario, idPedido: resultado.idPedido });
        irA("costo.html");
      } catch (err) {
        alert("Hubo un problema al registrar tu pedido. Intenta de nuevo.");
        btn.disabled = false;
        btn.textContent = "ACEPTAR";
      }
    });
  </script>
</body>
</html>
