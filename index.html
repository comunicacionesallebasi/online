<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allebasi - Catálogo</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body {
    background-color: #0d0d12 !important;
    min-height: 100vh;
  }
  #bg-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  .logo-wrapper {
    display: flex;
    justify-content: center;
    padding: 24px 0 16px;
    position: relative;
    z-index: 1;
  }
  .logo-wrapper .logo {
    width: 220px;
    height: 220px;
    object-fit: contain;
    border-radius: 50%;
    background-color: #f0f0f0;
    padding: 12px;
    box-sizing: border-box;
  }
  .contenedor {
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <div class="logo-wrapper">
    <img class="logo" src="assets/logo_allebasi.jpg" alt="Allebasi">
  </div>
  <div class="contenedor">
    <div id="lista" class="menu-lista">
      <p class="estado">Cargando catálogos...</p>
    </div>
  </div>

  <!-- Fondo geométrico fragmentado -->
  <script>
  (function () {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    function rnd(a, b) { return a + Math.random() * (b - a); }
    function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

    // Paleta de colores igual a la imagen de referencia
    const DARK   = ['#0e0e13','#111116','#14141a','#181820','#1c1c24'];
    const GRAY   = ['#252530','#2a2a38','#303040','#383845','#404050'];
    const LGRAY  = ['#4a4a58','#525262','#5a5a6a','#484858'];
    const PINK   = ['#c4a0b0','#cca8b8','#b89098','#d4b0c0','#c0a0ae'];
    const LPINK  = ['#dfc8d2','#e8d4dc','#f0dce4','#d8c4cc'];

    function drawScene() {
      const W = canvas.width;
      const H = canvas.height;

      // Fondo base casi negro
      ctx.fillStyle = '#0d0d12';
      ctx.fillRect(0, 0, W, H);

      const cx = W / 2, cy = H / 2;
      const maxR = Math.sqrt(cx * cx + cy * cy);

      // Función para sesgar posición hacia los bordes
      function edgePos() {
        let x, y;
        const t = Math.random();
        if (t < 0.35) {
          x = Math.random() < 0.5 ? rnd(0, W * 0.28) : rnd(W * 0.72, W);
          y = rnd(0, H);
        } else if (t < 0.60) {
          x = rnd(0, W);
          y = Math.random() < 0.5 ? rnd(0, H * 0.22) : rnd(H * 0.78, H);
        } else {
          x = rnd(0, W);
          y = rnd(0, H);
          const d = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
          if (d < maxR * 0.32 && Math.random() < 0.72) return null;
        }
        return { x, y };
      }

      const NUM = 220;
      for (let i = 0; i < NUM; i++) {
        const pos = edgePos();
        if (!pos) continue;
        const { x, y } = pos;

        // Color: zonas oscuras predominan, rosa/lavanda en menor proporción
        const colorRoll = Math.random();
        let color;
        if (colorRoll < 0.38) color = pick(DARK);
        else if (colorRoll < 0.60) color = pick(GRAY);
        else if (colorRoll < 0.76) color = pick(LGRAY);
        else if (colorRoll < 0.90) color = pick(PINK);
        else color = pick(LPINK);

        const size  = rnd(6, 58);
        const alpha = rnd(0.45, 1.0);
        const roll  = Math.random();

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle   = color;

        if (roll < 0.48) {
          // Triángulo (forma dominante en la imagen)
          ctx.translate(x, y);
          ctx.rotate(rnd(0, Math.PI * 2));
          ctx.beginPath();
          ctx.moveTo(0, -size);
          ctx.lineTo(size * rnd(0.6, 1.3),  size * rnd(0.5, 1.1));
          ctx.lineTo(-size * rnd(0.4, 1.0), size * rnd(0.3, 0.8));
          ctx.closePath();
          ctx.fill();

        } else if (roll < 0.72) {
          // Rectángulo / astilla
          const w = rnd(size * 0.4, size * 3.5);
          const h = rnd(size * 0.08, size * 0.7);
          ctx.translate(x, y);
          ctx.rotate(rnd(0, Math.PI * 2));
          ctx.fillRect(-w / 2, -h / 2, w, h);

        } else if (roll < 0.87) {
          // Polígono irregular
          const sides = Math.floor(rnd(3, 6));
          ctx.translate(x, y);
          ctx.rotate(rnd(0, Math.PI * 2));
          ctx.beginPath();
          for (let s = 0; s < sides; s++) {
            const ang = (s / sides) * Math.PI * 2;
            const r   = size * rnd(0.4, 1.0);
            s === 0
              ? ctx.moveTo(Math.cos(ang) * r, Math.sin(ang) * r)
              : ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
          }
          ctx.closePath();
          ctx.fill();

        } else {
          // Patrón de puntos (como los que se ven en la imagen de referencia)
          const dotR   = rnd(1.5, 4);
          const gap    = dotR * 2.8;
          const cols   = Math.floor(rnd(3, 8));
          const rows   = Math.floor(rnd(3, 8));
          const dotClr = pick([...PINK, ...LGRAY]);
          ctx.fillStyle = dotClr;
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              ctx.beginPath();
              ctx.arc(x + c * gap, y + r * gap, dotR, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }

        ctx.restore();
      }

      // Viñeta radial: centro ligeramente más oscuro, igual que la imagen
      const vig = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR * 0.85);
      vig.addColorStop(0,   'rgba(5,5,10,0.55)');
      vig.addColorStop(0.42,'rgba(5,5,10,0.18)');
      vig.addColorStop(1,   'rgba(0,0,0,0)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, W, H);
    }

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = Math.max(window.innerHeight, document.documentElement.scrollHeight);
      drawScene();
    }

    window.addEventListener('resize', resize);
    // Redibujar cuando el DOM crezca (más botones cargados)
    new MutationObserver(resize).observe(document.body, { childList: true, subtree: true });

    resize();
  })();
  </script>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script>
    limpiarPedido(); // el menú siempre empieza un pedido nuevo

    async function cargarMenu() {
      const cont = document.getElementById("lista");
      try {
        // VERSION 5: usa apiGetCached → sessionStorage + caché en servidor
        const data = await apiGetCached({ action: "menu" });
        if (!data.items || data.items.length === 0) {
          cont.innerHTML = '<p class="estado">No hay catálogos disponibles por ahora.</p>';
          return;
        }
        cont.innerHTML = "";
        data.items.forEach(item => {
          const btn = document.createElement("button");
          btn.className = "btn";
          btn.textContent = item.nombre;
          btn.onclick = () => {
            setPedido({ artista: item.nombre });
            irA("catalogo.html");
          };
          cont.appendChild(btn);
        });

        // VERSION 5: precarga todos los catálogos en segundo plano.
        // Cuando el usuario haga clic en un catálogo, la respuesta ya
        // está guardada en sessionStorage → apertura casi instantánea.
        prefetchCatalogs(data.items);

      } catch (e) {
        cont.innerHTML = '<p class="estado">No se pudo cargar el menú. Intenta de nuevo más tarde.</p>';
      }
    }

    /**
     * Precarga los catálogos en segundo plano, escalonados cada 600 ms
     * para no saturar el servidor con peticiones simultáneas.
     * Los resultados se guardan en sessionStorage vía apiGetCached.
     */
    function prefetchCatalogs(items) {
      items.forEach(function(item, i) {
        setTimeout(function() {
          apiGetCached({ action: "catalog", artist: item.nombre })
            .catch(function() {}); // silencioso: es solo una optimización
        }, 800 + i * 600);
      });
    }

    cargarMenu();
  </script>
</body>
</html>
